name: Release - Cabinet Médical

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Exécuter les tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Vérifier le projet
        run: |
          mkdir -p reports
          set -o pipefail
          ./scripts/check-project.sh 2>&1 | tee reports/test-report.txt

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-release
          path: reports/test-report.txt
          if-no-files-found: warn

  publish:
    name: Publier l'image Docker sur GHCR
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/souhancir/cabinet-medical:${{ github.ref_name }}

  deploy-test:
    name: Déployer et tester la release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer dans l'environnement de test
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          export DB_NAME=cabinet_medical
          export DB_PASS="$(openssl rand -hex 24)"
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"

          docker compose up -d --no-build

      - name: Vérifier la santé de l'application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo ""
              echo "SUCCES : application déployée et en bonne santé."
              exit 0
            fi
            echo "Attente du démarrage..."
            sleep 2
          done

          echo "ECHEC : l'application ne répond pas correctement."
          docker ps -a
          docker logs cabinet-app; docker logs cabinet-db
          exit 1
