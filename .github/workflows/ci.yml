
name: CI - Cabinet Médical

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Vérification du projet
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Exécuter les vérifications
        run: |
          mkdir -p reports
          set -o pipefail
          ./scripts/check-project.sh 2>&1 | tee reports/test-report.txt

      - name: Publier le rapport de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: reports/test-report.txt
          if-no-files-found: warn

  build:
    name: Construire l'image Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t cabinet-medical:ci .
